name: Android-Testbuild (.apk)

# Nur für dein Android-Testgerät. Start: Actions › „Android-Testbuild (.apk)“ › „Run workflow“
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Spiel bauen
        run: npm run build
        env:
          VITE_BUILD: a${{ github.run_number }}
      - name: Spiel ins Android-Projekt kopieren
        run: npx cap sync android
      - name: Bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk "Otterwelt-$(node -p "require('./package.json').version")-a${{ github.run_number }}-test.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Otterwelt-Android-Test-a${{ github.run_number }}
          path: "*.apk"
          retention-days: 14
