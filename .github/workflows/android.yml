name: Android-Testbuild (.apk)

# Nur für dein Android-Testgerät. Start: Actions › „Android-Testbuild (.apk)“ › „Run workflow“
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Android-Projekt erzeugen
        run: npx cap add android && npx cap sync android
      - name: Bauen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk "Otterwelt-$(node -p "require('./package.json').version")-test.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Otterwelt-Android-Test
          path: "*.apk"
          retention-days: 14
